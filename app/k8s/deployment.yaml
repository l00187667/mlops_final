apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-app-deployment 
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: my-ml-app-container
        image: vigneshchalla/mlop_final:latest
        ports:
        - containerPort: 5000